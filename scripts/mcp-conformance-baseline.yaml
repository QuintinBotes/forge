# Expected failures for scripts/mcp-conformance.sh: SUITE_VERSION 0.2.0-alpha.12,
# --requirements 2026-07-28. Each entry is `scenario` (every check) or
# `scenario:check-id` (that check only), followed by the reason on the same line.
# tests/test_mcp_conformance_runner.py fails on an entry without a reason. The suite
# fails the run when an entry starts passing, so remove it then.
# Recorded run and context: docs/integrations/mcp-conformance.md.
server:
