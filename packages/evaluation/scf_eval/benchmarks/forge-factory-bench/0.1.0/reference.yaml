# Known-good patches, by case id: the files each fix writes. Only the reference
# solver reads this file; it is not part of any case a solver receives.
ffb-chunk-remainder:
  - path: batching.py
    content: |
      def chunked(items, size):
          """Split ``items`` into lists of ``size`` items, in order; the last may be shorter."""
          if size < 1:
              raise ValueError("size must be at least 1")
          return [items[i : i + size] for i in range(0, len(items), size)]
ffb-slug-separators:
  - path: slugs.py
    content: |
      import re


      def slugify(text):
          """Lower-case ``text`` and join its words with single hyphens."""
          return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
ffb-roman-subtractive:
  - path: roman.py
    content: |
      _NUMERALS = [
          (1000, "M"),
          (900, "CM"),
          (500, "D"),
          (400, "CD"),
          (100, "C"),
          (90, "XC"),
          (50, "L"),
          (40, "XL"),
          (10, "X"),
          (9, "IX"),
          (5, "V"),
          (4, "IV"),
          (1, "I"),
      ]


      def to_roman(number):
          """Write ``number`` (1 to 3999) in Roman numerals."""
          if not 0 < number < 4000:
              raise ValueError("number must be between 1 and 3999")
          parts = []
          for value, numeral in _NUMERALS:
              count, number = divmod(number, value)
              parts.append(numeral * count)
          return "".join(parts)
ffb-duration-validation:
  - path: durations.py
    content: |
      import re

      _PART = re.compile(r"(\d+)([hms])")
      _WHOLE = re.compile(r"(?:\d+[hms])+")
      _SECONDS = {"h": 3600, "m": 60, "s": 1}


      def parse_duration(text):
          """Parse a duration such as ``"1h30m"`` or ``"45s"`` into seconds."""
          if not _WHOLE.fullmatch(text):
              raise ValueError(f"not a duration: {text!r}")
          return sum(int(amount) * _SECONDS[unit] for amount, unit in _PART.findall(text))
ffb-cart-subtotal-discount:
  - path: cart.py
    content: |
      from pricing import apply_discount


      class Cart:
          def __init__(self):
              self._lines = []

          def add(self, price_cents, quantity=1):
              self._lines.append((price_cents, quantity))

          def total(self, discount_percent=0):
              """What the cart costs in cents, after ``discount_percent`` on the subtotal."""
              subtotal = sum(price * quantity for price, quantity in self._lines)
              return apply_discount(subtotal, discount_percent)
