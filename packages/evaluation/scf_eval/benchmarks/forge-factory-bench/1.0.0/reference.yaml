ffb-stock-reserve:
  - path: stock.py
    content: |
      class InsufficientStock(ValueError):
          """Fewer units are available than were asked for."""


      class Stock:
          """Units on hand, by SKU."""

          def __init__(self):
              self._levels = {}

          def receive(self, sku, quantity):
              self._levels[sku] = self._levels.get(sku, 0) + quantity

          def level(self, sku):
              return self._levels.get(sku, 0)

          def reserve(self, sku, quantity):
              available = self.level(sku)
              if quantity > available:
                  raise InsufficientStock(f"{sku}: {quantity} asked, {available} available")
              self._levels[sku] = available - quantity
ffb-template-defaults:
  - path: templates.py
    content: |
      import re

      _FIELD = re.compile(r"\{(\w+)(?:\|([^}]*))?\}")


      def render(template, values):
          """Fill each ``{name}`` or ``{name|default}`` in ``template`` from ``values``."""

          def fill(match):
              name, default = match.groups()
              if name in values:
                  return str(values[name])
              if default is None:
                  raise KeyError(name)
              return default

          return _FIELD.sub(fill, template)
ffb-version-bump:
  - path: versions.py
    content: |
      _PARTS = ("major", "minor", "patch")


      def parse_version(text):
          """``"1.4.2"`` as ``(1, 4, 2)``."""
          major, minor, patch = (int(part) for part in text.split("."))
          return major, minor, patch


      def bump(version, part):
          """The version after ``version`` when ``part`` changes; later parts reset to 0."""
          if part not in _PARTS:
              raise ValueError(f"part must be one of {_PARTS}: {part!r}")
          index = _PARTS.index(part)
          numbers = list(parse_version(version))
          numbers[index] += 1
          numbers[index + 1 :] = [0] * (2 - index)
          return ".".join(str(number) for number in numbers)
ffb-cache-eviction:
  - path: memo.py
    content: |
      from collections import OrderedDict


      class Cache:
          """A key-value cache; with ``max_items``, the least recently used key is evicted."""

          def __init__(self, max_items=None):
              self._items = OrderedDict()
              self._max_items = max_items

          def get(self, key, default=None):
              if key not in self._items:
                  return default
              self._items.move_to_end(key)
              return self._items[key]

          def put(self, key, value):
              self._items[key] = value
              self._items.move_to_end(key)
              if self._max_items is not None and len(self._items) > self._max_items:
                  self._items.popitem(last=False)

          def __len__(self):
              return len(self._items)
