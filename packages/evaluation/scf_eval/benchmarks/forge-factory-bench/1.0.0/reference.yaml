ffb-chunk-remainder:
  - path: batching.py
    content: |
      def chunked(items, size):
          """Split ``items`` into lists of ``size`` items, in order; the last may be shorter."""
          if size < 1:
              raise ValueError("size must be at least 1")
          return [items[i : i + size] for i in range(0, len(items), size)]
