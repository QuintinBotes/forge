      from money import format_cents


      def test_whole_and_part_amounts():
          assert format_cents(1234) == "12.34"
          assert format_cents(5) == "0.05"


      def test_negative_amounts():
          assert format_cents(-150) == "-1.50"
          assert format_cents(-5) == "-0.05"
ffb-flag-case:
  - path: flags.py
    content: |
      def parse_flag(text):
          """Read a flag in any case and spacing: true, yes and 1 are True; false, no and 0 False."""
          word = text.strip().lower()
          if word in ("true", "yes", "1"):
              return True
          if word in ("false", "no", "0"):
              return False
          raise ValueError(f"not a flag: {text!r}")
  - path: tests/test_flags.py
    content: |
      import pytest

      from flags import parse_flag


      def test_lower_case_words():
          assert parse_flag("yes") is True
          assert parse_flag("0") is False
          with pytest.raises(ValueError):
              parse_flag("maybe")


      def test_any_case_and_surrounding_spaces():
          assert parse_flag(" TRUE ") is True
          assert parse_flag("No\n") is False
