      #: The size of each unit, in metres.
      FACTORS = {"mm": 0.001, "cm": 0.01, "m": 1, "km": 1000}


      def to_metres(value, unit):
          """``value`` in ``unit`` (a key of ``FACTORS``), as metres."""
          if unit not in FACTORS:
              raise ValueError(f"unknown unit: {unit}")
          return value * FACTORS[unit]
ffb-id-generator-class:
  - path: ids.py
    content: |
      class IdGenerator:
          """Numbers identifiers from 1, independently of every other generator."""

          def __init__(self):
              self._counter = 0

          def next_id(self, prefix="id"):
              """The next identifier: ``id-1``, then ``id-2``, and so on."""
              self._counter += 1
              return f"{prefix}-{self._counter}"


      _default = IdGenerator()


      def next_id(prefix="id"):
          """The next identifier from the module's shared generator."""
          return _default.next_id(prefix)
ffb-negative-cents:
  - path: money.py
    content: |
      def format_cents(cents):
          """``cents`` as a decimal amount: 1234 is "12.34" and -150 is "-1.50"."""
          sign = "-" if cents < 0 else ""
          whole, part = divmod(abs(cents), 100)
          return f"{sign}{whole}.{part:02d}"
  - path: tests/test_money.py
