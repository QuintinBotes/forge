cases:
  - id: ffb-cache-eviction
    kind: agent_task
    tags: [agent_task, feature]
    expected_ids: [REQ-CACHE-1]
    query: |
      Cache grows without bound

      Add an optional max_items argument to Cache. When a put() would hold more than
      max_items keys, evict the key used least recently; both get() and put() count as
      a use. Cache() without the argument keeps every item, as it does now.
    metadata:
      expected_terminal_state: awaiting_review
      repo:
        - path: memo.py
          content: |
            class Cache:
                """A key-value cache."""

                def __init__(self):
                    self._items = {}

                def get(self, key, default=None):
                    return self._items.get(key, default)

                def put(self, key, value):
                    self._items[key] = value

                def __len__(self):
                    return len(self._items)
      held_out:
        - path: tests/test_memo.py
          content: |
            from memo import Cache


            def test_least_recently_used_key_is_evicted():
                cache = Cache(max_items=2)
                cache.put("a", 1)
                cache.put("b", 2)
                assert cache.get("a") == 1
                cache.put("c", 3)
                assert cache.get("b") is None
                assert (cache.get("a"), cache.get("c"), len(cache)) == (1, 3, 2)


            def test_unbounded_cache_keeps_everything():
                cache = Cache()
                for number in range(100):
                    cache.put(number, number * 2)
                assert len(cache) == 100
                assert cache.get(0) == 0
                assert cache.get("missing", "none") == "none"
      fail_to_pass: [tests/test_memo.py::test_least_recently_used_key_is_evicted]
      pass_to_pass: [tests/test_memo.py::test_unbounded_cache_keeps_everything]
