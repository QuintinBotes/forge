# forge-factory-bench 1.0.0: the first released version of the end-to-end benchmark
# (#198). FROZEN: content_hash is computed by `scf bench freeze` over the sorted cases
# and the scoring. Editing a case or the scoring makes every benchmark command reject
# the suite; add a new version directory instead. reference.yaml holds the known-good
# patches and is not part of what a solver receives. docs/benchmarks/ describes it.
