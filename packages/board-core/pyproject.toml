[project]
name = "scf-board"
version = "0.1.0"
description = "Board domain services: epics, tasks, sprints, milestones, incidents."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "scf-db",
    "scf-policy",
    "scf-skill",
    "scf-workflow",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_board"]

[tool.uv.sources]
scf-policy = { workspace = true }
