[project]
name = "scf-coordinator"
version = "0.1.0"
description = "Supervisor pattern multi-agent coordination for Swarm Code Factory."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "scf-agent",
    "scf-policy",
    "scf-skill",
    "scf-db",
    "scf-knowledge",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_coordinator"]
