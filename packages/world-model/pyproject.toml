[project]
name = "scf-world"
version = "0.1.0"
description = "World model — an append-only bitemporal fact ledger: two clocks (world time and record time), evidence-backed extraction, temporal closing, identity recall, proposal governance, reasoning, and decision drift. Pure domain logic plus the SQL repository; HTTP lives in scf-api."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "scf-db",
    "scf-knowledge",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
]

[tool.uv.sources]
scf-contracts = { workspace = true }
scf-db = { workspace = true }
scf-knowledge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_world"]
