[project]
name = "scf-auth"
version = "0.1.0"
description = "Pure auth & secrets crypto core for Swarm Code Factory (F37): envelope vault, platform keys, session JWT, flat RBAC, secret redaction."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_auth"]
