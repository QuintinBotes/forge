[project]
name = "scf-spec"
version = "0.1.0"
description = "Spec-driven development lifecycle, manifest, and gating engine."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_spec"]
