[project]
name = "scf-db"
version = "0.1.0"
description = "SQLAlchemy 2.x data model and Alembic migrations for Swarm Code Factory."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_db"]
