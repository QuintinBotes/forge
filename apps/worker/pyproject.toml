[project]
name = "scf-worker"
version = "0.1.0"
description = "Celery worker application: indexer, syncer, and agent-runner tasks."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "scf-db",
    "scf-agent",
    "scf-knowledge",
    "scf-mcp",
    "scf-board",
    "scf-skill",
    # F32 — integration marketplace: catalog-sync + update-flag worker tasks.
    "scf-marketplace",
    "scf-api",
    # F38 — cost.reprice + obs.refresh_freshness_gauges tasks and the worker
    # UsageMeter wiring.
    "scf-obs",
    "scf-workflow",
    # F31 — deployment gates: drive promotions/health/rollback on the worker.
    "scf-deploy",
    "celery>=5.3",
    "redis>=5.0",
    "scf-approval",
    # F41 — Self-Eval Gate: mint hidden regression cases into private suites and
    # re-freeze their manifests (scf_eval.mint + benchmark.manifest.freeze);
    # scf-integrations supplies the GitHub PR-data source in the prod seam.
    "scf-eval",
    "scf-integrations",
    # Task 17 — supervised multi-agent dispatch: forge.agent.run drives the F27
    # Supervisor (scf_coordinator) when execution_mode=supervised_multi_agent.
    "scf-coordinator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_worker"]

[tool.uv.sources]
scf-approval = { workspace = true }
