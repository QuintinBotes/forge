[project]
name = "scf-mcp-gateway"
version = "0.1.0"
description = "MCP client manager gateway service for Swarm Code Factory."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "scf-mcp",
    # F38 — metrics facade (forge_mcp_* emission) + telemetry init.
    "scf-obs",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_mcp_gateway"]
