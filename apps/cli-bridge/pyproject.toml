[project]
name = "forge-cli-bridge"
version = "0.1.0"
description = "Loopback host bridge exposing local agent CLIs to the Forge worker."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Forge Authors" }]
dependencies = [
    "forge-contracts",
    "forge-agent",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge_cli_bridge"]
