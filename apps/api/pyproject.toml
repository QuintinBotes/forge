[project]
name = "scf-api"
version = "0.1.0"
description = "FastAPI backend application for Swarm Code Factory."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "The Swarm Code Factory Authors" }]
dependencies = [
    "scf-contracts",
    "scf-db",
    "scf-board",
    "scf-knowledge",
    "scf-mcp",
    "scf-skill",
    # F32 — integration marketplace SDK (registry client, verifier, installer).
    "scf-marketplace",
    # F36 — Human Approval System SDK (unified gate service, authorizer, registry).
    "scf-approval",
    # H1 — world model (bitemporal fact ledger: domain, repository, extraction).
    "scf-world",
    # F38 — observability & cost metrics SDK (metrics facade, cost ledger seams,
    # usage meter, structured logging).
    "scf-obs",
    # F37 — auth & secrets crypto core (envelope vault, session JWT, flat RBAC,
    # canonical secret redaction).
    "scf-auth",
    # F25 — workflow engine (FSM + Temporal V2): the /workflow router, engine
    # selection, Temporal readiness check, and the temporal bootstrap/replay CLI.
    "scf-workflow",
    # F31 — deployment gates: engine, gate evaluator, providers, health, rollback.
    "scf-deploy",
    "scf-policy",
    # F35 — benchmark suite & public leaderboard (frozen suites, deterministic
    # scoring, replay verification, ranking — the pure core the service wires).
    "scf-eval",
    # Adaptive Orchestration — complexity sizing + per-role config resolver
    # (ao-settings-api mounts the settings/routing-preview endpoints on top).
    "scf-orchestration-policy",
    # Adaptive Orchestration — the provider-agnostic tier -> model router
    # (ao-settings-api's routing-preview resolves a concrete model through it).
    "scf-agent",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.53.0",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "httpx>=0.27",
    # Enqueue background MCP index syncs onto the worker's Celery queue (F20).
    "celery>=5.3",
    "signxml>=5.1.0",
    # OIDC SSO: ID-token signature/claim validation (F33).
    "pyjwt[crypto]>=2.15.1",
    "lxml>=5.3",
    "python-multipart>=0.0.9",
    # RT-2 optional Redis pub/sub fan-out for the realtime broadcaster
    # (redis.asyncio); the in-process backend needs no live Redis.
    "redis>=5.0",
    "pycrdt>=0.14.1",
    "scf-integrations",
]

[project.scripts]
# Verify attestations and audit-chain exports offline (exit non-zero on any
# verification failure) — the evidence command behind release gate G-ATTEST.
scf-verify = "scf_api.cli_verify:main"
# The old name, kept so existing scripts still run.
forge-verify = "scf_api.cli_verify:main"
# Time-Travel Runs: replay a persisted RunRecording cassette by substitution
# and diff it against the tape (exit non-zero on divergence).
scf-replay = "scf_api.cli_replay:main"
# The old name, kept so existing scripts still run.
forge-replay = "scf_api.cli_replay:main"
# Operator commands plus the remote board/specs/approvals/runs reads desktop
# clients such as tervin draw (spec L seam 2).
scf-cli = "scf_api.cli:main"
# The old name, kept so existing scripts still run.
forge-cli = "scf_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scf_api"]

[tool.uv.sources]
scf-integrations = { workspace = true }
scf-world = { workspace = true }
