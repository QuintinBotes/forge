{{- /* Run all fail-fast guards once, from this always-rendered object. */ -}}
{{- include "swarm-code-factory.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "swarm-code-factory.configMapName" . }}
  labels:
    {{- include "swarm-code-factory.componentLabels" (dict "ctx" . "component" "config") | nindent 4 }}
  annotations:
    # Created as an early hook (-10) so the pre-install/pre-upgrade migrate Job
    # (-5) can read it; persists for the app pods (before-hook-creation only
    # deletes right before the next hook run, then immediately recreates).
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- include "swarm-code-factory.configEnv" . | nindent 2 }}
