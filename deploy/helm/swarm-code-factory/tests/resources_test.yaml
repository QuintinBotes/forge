suite: resource requests + limits (AC6)
templates:
  - templates/api/deployment.yaml
  - templates/worker/deployment.yaml
  - templates/web/deployment.yaml
  - templates/mcp-gateway/deployment.yaml
  - templates/job-migrate.yaml
  - templates/temporal-worker/deployment.yaml
# The Temporal worker renders only with the durable engine on (#293).
set:
  temporal.enabled: true
  temporal.host: temporal-frontend.example.com:7233
  secrets.data.TEMPORAL_CODEC_KEY: chart-test-codec-key
tests:
  - it: declares cpu/memory requests and limits on every container
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].resources.requests.cpu
      - isNotNull:
          path: spec.template.spec.containers[0].resources.requests.memory
      - isNotNull:
          path: spec.template.spec.containers[0].resources.limits.cpu
      - isNotNull:
          path: spec.template.spec.containers[0].resources.limits.memory
