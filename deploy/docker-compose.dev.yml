# Forge — local development Docker Compose (single-command dev stack).
#
# ONE command brings the whole stack up, healthy, migrated and seeded:
#
#   docker compose -f deploy/docker-compose.dev.yml up -d --build --wait
#
# (or `scripts/dev.sh up` / `make dev-up`).
#
#   Web UI:  http://localhost:3000        API:   http://localhost:8000
#   Caddy:   http://localhost:8080        Docs:  http://localhost:8000/docs
#
# Design notes:
#   * A fixed project name (`forge-dev`) isolates this stack from any other
#     compose project / standalone container on the host.
#   * Internal services (db, redis, minio, mcp-gateway) are NOT published to the
#     host — services reach them over the compose network by name (db:5432,
#     redis:6379, ...), so the host ports 5432/6379/etc. are never touched.
#   * Only web (3000), api (8000) and caddy (8080) publish host ports, and every
#     host port is env-overridable with a conflict-free default.
#   * A one-shot `migrate` service runs `alembic upgrade head` before api/worker
#     start; a one-shot `seed` service then seeds the demo workspace. Both are
#     idempotent and gate the app tier via `service_completed_successfully`.
#   * Every long-running service has a healthcheck so `--wait` blocks until the
#     stack is actually ready.
#
# All defaults below are SAFE DEV-ONLY values; override via deploy/.env.dev
# (used automatically by scripts/dev.sh) or the shell environment.

name: forge-dev

# Durable persistence selection (composition root).
#
# Every one of these seams defaults to ``memory`` in ``forge_api.settings`` so
# the unit suite stays hermetic and Postgres-free. That default is a TEST
# default, not a deployment one: a stack that leaves them unset keeps minted API
# keys, board rows, audit entries, approvals, and BYOK ciphertext in the API
# process and loses all of it on restart. The compose files are the composition
# root, so they select the durable Postgres-backed backend explicitly here.
#
# Each var is still overridable (``FORGE_BOARD_BACKEND=memory docker compose up``)
# for a deliberately ephemeral stack.
x-persistence-env: &persistence-env
  FORGE_APIKEY_BACKEND: ${FORGE_APIKEY_BACKEND:-db}
  FORGE_APPROVAL_BACKEND: ${FORGE_APPROVAL_BACKEND:-db}
  FORGE_AUDIT_BACKEND: ${FORGE_AUDIT_BACKEND:-db}
  FORGE_BOARD_BACKEND: ${FORGE_BOARD_BACKEND:-db}
  FORGE_OVERRIDE_GRANT_BACKEND: ${FORGE_OVERRIDE_GRANT_BACKEND:-db}
  FORGE_PM_LINK_BACKEND: ${FORGE_PM_LINK_BACKEND:-db}
  FORGE_POLICY_AUDIT_BACKEND: ${FORGE_POLICY_AUDIT_BACKEND:-db}
  FORGE_PROJECTION_BACKEND: ${FORGE_PROJECTION_BACKEND:-db}
  FORGE_SECRET_BACKEND: ${FORGE_SECRET_BACKEND:-db}

# Shared env for the Python services (api / worker / mcp-gateway / migrate / seed).
x-python-env: &python-env
  <<: *persistence-env
  FORGE_ENV: development
  FORGE_ENVIRONMENT: development
  FORGE_DEBUG: "true"
  FORGE_SECRET_KEY: ${FORGE_SECRET_KEY:-dev-only-insecure-secret-change-me-0123456789abcdef}
  FORGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@db:5432/${POSTGRES_DB:-forge}
  FORGE_REDIS_URL: redis://redis:6379/0
  MCP_GATEWAY_URL: http://mcp-gateway:8001
  MINIO_ENDPOINT: http://minio:9000
  # HARD-02 BYOK model provider. FORGE_MODEL_PROVIDER (anthropic|openai) is the
  # master switch; unset OR empty -> the offline deterministic scripted client
  # (ModelClientConfig.from_env strips/falsy-checks these, so the empty-default
  # form is unset-equivalent). Provider-native ANTHROPIC/OPENAI keys win, then the
  # provider-agnostic FORGE_MODEL_API_KEY. Passed explicitly because this shared
  # env map has no env_file, so a root .env only reaches ${VAR} references.
  FORGE_MODEL_PROVIDER: ${FORGE_MODEL_PROVIDER:-}
  FORGE_MODEL_NAME: ${FORGE_MODEL_NAME:-}
  FORGE_MODEL_API_KEY: ${FORGE_MODEL_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  # F27 multi-agent coordinator (supervised runs); read by CoordinatorSettings.
  MULTI_AGENT_ENABLED: ${MULTI_AGENT_ENABLED:-false}

services:
  # --------------------------------------------------------------------- #
  # Data tier — internal only (no published host ports)                   #
  # --------------------------------------------------------------------- #
  db:
    image: pgvector/pgvector:pg16@sha256:ad2e18408bf447f62092a8a5259e7df10505c5a0360bd1a1853ac8b8b0763da2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
      POSTGRES_DB: ${POSTGRES_DB:-forge}
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forge-dev-password}
    volumes:
      - dev-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --------------------------------------------------------------------- #
  # One-shot init: migrations then demo seed (gate the app tier)          #
  # --------------------------------------------------------------------- #
  migrate:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    image: forge/api:dev
    command: ["alembic", "-c", "packages/db/alembic.ini", "upgrade", "head"]
    environment: *python-env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: forge/api:dev
    command: ["python", "-m", "forge_api.scripts.seed"]
    environment:
      <<: *python-env
      # Mint + print an admin API key. A fresh install has no other way in: the
      # UI has no password login and /auth/login needs an IdP nobody has
      # configured yet. Dev-only — the token lands in this container's log.
      FORGE_SEED_ADMIN_KEY: ${FORGE_SEED_ADMIN_KEY:-true}
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --------------------------------------------------------------------- #
  # Application tier                                                       #
  # --------------------------------------------------------------------- #
  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    image: forge/api:dev
    command: ["uvicorn", "forge_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *python-env
      FORGE_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    image: forge/worker:dev
    command: ["celery", "-A", "forge_worker", "worker", "--loglevel=info"]
    environment: *python-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A forge_worker inspect ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mcp-gateway:
    build:
      context: ..
      dockerfile: deploy/docker/mcp-gateway.Dockerfile
    image: forge/mcp-gateway:dev
    command:
      - "uvicorn"
      - "forge_mcp_gateway.app:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"
    environment: *python-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.dev.Dockerfile
    image: forge/web:dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Point the browser at the API *through Caddy*, not at the API's own host
      # port. Caddy serves the UI and /api/* from one origin, so there is no
      # cross-origin request to authorise and the whole app works at
      # http://localhost:${CADDY_PORT:-8080}. Pointing straight at :8000 is what
      # made a first-run install look broken: the page loaded and every fetch
      # failed CORS with nothing on screen saying why.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${CADDY_PORT:-8080}/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:${CADDY_PORT:-8080}/ws}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || exit 1"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # --------------------------------------------------------------------- #
  # Edge proxy — single entrypoint at http://localhost:8080               #
  # --------------------------------------------------------------------- #
  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - dev-caddy-data:/data
      - dev-caddy-config:/config
    ports:
      - "${CADDY_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  dev-db-data:
  dev-redis-data:
  dev-minio-data:
  dev-caddy-data:
  dev-caddy-config:
