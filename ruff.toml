# Ruff configuration for the SCF workspace.
target-version = "py312"
line-length = 100
src = ["packages", "apps", "tests"]

extend-exclude = [
    ".venv",
    "node_modules",
    "apps/web",
    "**/migrations/versions",
    # HARD-09 SAST fixtures deliberately contain rule-triggering constructs.
    "tests/security/fixtures",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = []

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]
# F38 cost tests import their fixtures from a uniquely-named support module
# (a second package-less conftest.py would collide with the marketplace tests'
# `from conftest import ...`); fixture params legitimately shadow those imports.
"apps/api/tests/cost/*" = ["F811"]

[lint.isort]
known-first-party = [
    "scf_contracts",
    "scf_db",
    "scf_workflow",
    "scf_deploy",
    "scf_agent",
    "scf_coordinator",
    "scf_spec",
    "scf_orchestration_policy",
    "scf_risk",
    "scf_board",
    "scf_knowledge",
    "scf_integrations",
    "scf_mcp",
    "scf_policy",
    "scf_authz",
    "scf_auth",
    "scf_skill",
    "scf_eval",
    "scf_marketplace",
    "scf_approval",
    "scf_world",
    "scf_obs",
    "scf_api",
    "scf_worker",
    "scf_mcp_gateway",
    "scf_cli_bridge",
]

[format]
quote-style = "double"
indent-style = "space"
